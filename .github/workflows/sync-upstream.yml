name: Sync Fork with Upstream (Clean Rebase)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: dev

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/blakeblackshear/frigate.git || true
          git fetch upstream dev
          git fetch origin dev

      - name: Check if sync needed
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/dev)
          FORK_SHA=$(git rev-parse origin/dev)

          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          echo "fork_sha=$FORK_SHA" >> $GITHUB_OUTPUT

          if [ "$UPSTREAM_SHA" != "$FORK_SHA" ]; then
            echo "sync_needed=true" >> $GITHUB_OUTPUT
            echo "Sync needed - upstream has new commits"
          else
            echo "sync_needed=false" >> $GITHUB_OUTPUT
            echo "Fork is already up to date"
          fi

      - name: Attempt clean rebase
        if: steps.check.outputs.sync_needed == 'true'
        id: rebase
        run: |
          echo "Starting clean rebase..."

          # Create backup branch
          git branch backup-before-rebase-$(date +%Y%m%d) || true

          # Switch to dev and attempt rebase
          git checkout dev

          if git rebase upstream/dev; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "Clean rebase successful!"
            git log --oneline ${{ steps.check.outputs.fork_sha }}..HEAD | head -5
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "Rebase conflicts detected"
            git rebase --abort
          fi

      - name: Push successful rebase
        if: steps.check.outputs.sync_needed == 'true' && steps.rebase.outputs.success == 'true'
        run: |
          echo "Pushing rebased changes..."
          # Force push with lease - safe way to rewrite history after rebase
          git push origin dev --force-with-lease
          echo "Successfully synced with clean rebase!"

      - name: Create conflict resolution PR
        if: steps.check.outputs.sync_needed == 'true' && steps.rebase.outputs.success == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONFLICT_BRANCH="resolve-sync-conflicts-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $CONFLICT_BRANCH

          # Create simple instructions file
          echo "# Sync Conflicts Resolution" > SYNC_CONFLICTS.md
          echo "" >> SYNC_CONFLICTS.md
          echo "Rebase conflicts detected when syncing with upstream." >> SYNC_CONFLICTS.md
          echo "" >> SYNC_CONFLICTS.md
          echo "## To resolve:" >> SYNC_CONFLICTS.md
          echo "1. git rebase upstream/dev" >> SYNC_CONFLICTS.md
          echo "2. Resolve conflicts" >> SYNC_CONFLICTS.md
          echo "3. git add ." >> SYNC_CONFLICTS.md
          echo "4. git rebase --continue" >> SYNC_CONFLICTS.md
          echo "5. git push origin dev --force-with-lease" >> SYNC_CONFLICTS.md

          git add SYNC_CONFLICTS.md
          git commit -m "Sync conflicts detected - manual resolution needed"
          git push origin $CONFLICT_BRANCH

          # Create simple PR
          gh pr create \
            --title "Resolve Upstream Sync Conflicts" \
            --body "Rebase conflicts detected. See SYNC_CONFLICTS.md for resolution steps." \
            --head $CONFLICT_BRANCH \
            --base dev

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.sync_needed }}" = "false" ]; then
            echo "Already up to date with upstream"
          elif [ "${{ steps.rebase.outputs.success }}" = "true" ]; then
            echo "Successfully synced with clean rebase"
          else
            echo "Created PR for manual conflict resolution"
          fi
